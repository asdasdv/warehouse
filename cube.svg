@import "https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&display=swap";*{box-sizing:border-box}body{color:#252623;background:#f8f8f4;margin:0;font:13px Inter,Arial,sans-serif}button,a,input,select{font:inherit}button,a{cursor:pointer}a{color:inherit;text-decoration:none}button{color:inherit;background:#fff;border:1px solid #deded7;border-radius:6px;padding:10px 14px}button:hover{background:#f0f0e8}button:disabled{opacity:.4;cursor:default}.primary{background:#ffe500;border-color:#ffe500}header{background:#fff;border-bottom:1px solid #ddd;justify-content:space-between;align-items:center;gap:20px;height:76px;padding:0 30px;display:flex}.brand{font:700 24px Georgia}.badge{color:#66559a;background:#f0edff;border-radius:4px;padding:5px 9px;font-size:10px}nav{gap:5px;display:flex}nav button{background:0 0;border:0}nav button.active{background:#ffe500}.layout{grid-template-columns:minmax(0,1fr) 310px;min-height:calc(100vh - 76px);display:grid}main{min-width:0;padding:30px}aside{background:#fff;border-left:1px solid #ddd;padding:25px 20px}h1{margin:0;font:46px Instrument Serif,Georgia}h2{margin:0 0 16px;font:30px Instrument Serif,Georgia}h3{margin:0 0 12px;font-size:14px}.heading{justify-content:space-between;align-items:center;margin-bottom:24px;display:flex}.sub,small{color:#83867b;font-size:11px;line-height:1.6}.metrics{grid-template-columns:repeat(5,1fr);gap:10px;margin:22px 0;display:grid}.metric{background:#fff;border:1px solid #e0e0d8;border-radius:10px;padding:17px}.metric strong{margin:8px 0;font-size:28px;font-weight:500;display:block}.metric:last-child{background:#fff3ef}.map{background:#f0f1ec;border:1px solid #dedfd6;border-radius:12px;padding:15px}.map svg{width:100%;height:auto;display:block}.map button{padding:5px 8px}.legend{color:#6c7065;gap:18px;margin-bottom:12px;font-size:11px;display:flex}.dot{background:#333;border-radius:3px;width:8px;height:8px;margin-right:5px;display:inline-block}.dot.red{background:#bf4032}.dot.purple{background:#8d80c5}.robot{cursor:pointer}.robot:focus{outline:none}.robot:focus rect{stroke:#e6bb00;stroke-width:4px}.selected{stroke:#e5bb00;stroke-width:4px}.detail{border:1px solid #bbb;border-radius:12px;margin-bottom:25px;padding:18px}.detail p{line-height:1.6}.actions{flex-wrap:wrap;gap:6px;margin-top:15px;display:flex}.status{background:#f1f2ed;border-radius:4px;padding:4px 7px;font-size:10px;display:inline-block}.status.Moving,.status.Completed,.status.Ready{color:#29734a;background:#e2f2e7}.status.Blocked,.status.Offline{color:#b73326;background:#ffe9e4}.status.Charging{color:#66559a;background:#eee8ff}.fleetrow{text-align:left;background:0 0;border:0;border-bottom:1px solid #eee;border-radius:0;justify-content:space-between;width:100%;padding:12px 0;display:flex}.fleetlist{max-height:390px;overflow:auto}.notice{background:#fff;border-left:3px solid #ffe500;margin:18px 0;padding:12px;line-height:1.6}.tablewrap{background:#fff;border:1px solid #e0e0d8;border-radius:10px;overflow:auto}table{border-collapse:collapse;white-space:nowrap;width:100%}th,td{text-align:left;border-bottom:1px solid #eee;padding:14px;font-size:12px}th{text-transform:uppercase;color:#888;font-size:10px;font-weight:500}tr:hover{background:#fafaf5}.toolbar{gap:10px;margin:20px 0;display:flex}.toolbar input{border:1px solid #ddd;border-radius:6px;flex:1;min-width:80px;padding:10px}select{background:#fff;border:1px solid #ddd;border-radius:6px;padding:10px}.stations{grid-template-columns:repeat(2,1fr);gap:15px;display:grid}.station{background:#fff;border:1px solid #ddd;border-radius:10px;padding:22px}.event{border-bottom:1px solid #eee;padding:12px 0}.sources{max-width:800px;line-height:1.8}.sources a{text-decoration:underline}.sources li{margin:12px 0}dialog{border:1px solid #ddd;border-radius:12px;width:420px;padding:28px}dialog::backdrop{background:#0004}label{margin:12px 0;display:block}label select{width:100%;margin-top:5px}footer{color:#777;margin-top:16px;font-size:10px}@media (width<=1000px){.layout{grid-template-columns:1fr}aside{border-left:0}.metrics{grid-template-columns:repeat(3,1fr)}header{flex-wrap:wrap;height:auto;padding:16px}main{padding:20px}nav{flex-wrap:wrap}}
