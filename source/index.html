<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Porter — Warehouse</title><meta name="description" content="Porter is a concept warehouse app: receive goods, find any box and ship it while robots do the carrying."><link rel="icon" type="image/png" href="/icon.png"><link rel="apple-touch-icon" href="/icon.png"><meta name="theme-color" content="#ffffff"><style>
/* Loading screen: the logo box glancing around, until the 3D warehouse is ready (scene.js removes it). */
#boot{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:#f2f3f5;transition:opacity .4s ease}
#boot.done{opacity:0;pointer-events:none}
#boot svg{width:192px;height:192px}
#boot .eyes{animation:boot-look 2.4s infinite}
@keyframes boot-look{
0%{transform:translate(0,0);animation-timing-function:cubic-bezier(.2,0,0,1)}
10.4%,29.2%{transform:translate(-3.1px,.9px);animation-timing-function:cubic-bezier(.45,0,.55,1)}
39.6%,58.3%{transform:translate(3.1px,-.9px);animation-timing-function:cubic-bezier(.45,0,.55,1)}
68.8%,85.4%{transform:translate(.9px,-3.1px);animation-timing-function:cubic-bezier(.45,0,.55,1)}
100%{transform:translate(0,0)}}
@media (prefers-reduced-motion:reduce){#boot .eyes{animation:none}}
</style></head><body><div id="boot" role="status" aria-label="Loading the warehouse"><svg viewBox="0 0 120 120" aria-hidden="true"><g stroke-linejoin="round" stroke-width="6"><path d="M16 38L60 62L60 108L16 84Z" fill="#e1e9f6" stroke="#e1e9f6"/><path d="M60 62L104 38L104 84L60 108Z" fill="#c7d6ec" stroke="#c7d6ec"/><path d="M60 14L104 38L60 62L16 38Z" fill="#fff" stroke="#fff"/></g><path d="M34.5 27.9L41.5 24.1L85.5 48.1L85.5 60.5L78.5 64.3L78.5 51.9Z" fill="#4ca8f8"/><g class="eyes"><ellipse cx="75" cy="80" rx="3.5" ry="5.5" fill="#14181c"/><circle cx="75" cy="77.2" r="1.2" fill="#fff"/><ellipse cx="89" cy="72.5" rx="3.5" ry="5.5" fill="#14181c"/><circle cx="89" cy="69.7" r="1.2" fill="#fff"/></g></svg></div><div id="app"></div><script type="module" src="/main.js"></script></body></html>
